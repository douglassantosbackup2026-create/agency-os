name: Supabase DB lint (opcional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase db lint
        continue-on-error: true
        run: supabase db lint
