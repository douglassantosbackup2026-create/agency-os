name: Supabase DB lint (opcional)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase db lint (requer SUPABASE_ACCESS_TOKEN)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db lint

      - name: supabase db lint (skipped)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "Defina SUPABASE_ACCESS_TOKEN para lint estrito em CI."
